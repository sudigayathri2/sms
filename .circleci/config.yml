version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/sms:v1 .
      - run:
          name: Login to Docker Hub
          command: |
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
      - run:
          name: Push Image
          command: |
            docker push $DOCKERHUB_USERNAME/sms:v1

workflows:
  version: 2
  build_and_push_workflow:
    jobs:
      - build-and-push
