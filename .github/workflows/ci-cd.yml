name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-docker-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout project
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Maven build
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 4️⃣ Log in to Docker Hub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Verify Docker login (optional, debug step)
      - name: Verify Docker Login
        run: docker info

      # 6️⃣ Build Docker image
      - name: Build Docker Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/sms-app
          TAG=latest
          docker build -t $IMAGE_NAME:$TAG .
          docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:${GITHUB_SHA::7}

      # 7️⃣ Push Docker image
      - name: Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/sms-app
          TAG=latest
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:${GITHUB_SHA::7}

      # 8️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 9️⃣ Configure kubeconfig
      - name: Setup Kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      # 🔟 Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml --validate=true
          kubectl apply -f k8s/service.yaml --validate=true
